        function HumanModel(props) {
            const group = useRef();
            const scroll = useScroll();
            const texture = useMemo(() => new THREE.TextureLoader().load(IMG_SRC), []);
            texture.colorSpace = THREE.SRGBColorSpace;

            useFrame((state, delta) => {
                if(group.current) {
                    group.current.rotation.y += delta * 0.5;
                    const offset = scroll.offset;
                    let targetX = 2; 
                    let targetY = -0.5; 
                    if (offset > 0.30 && offset <= 0.60) { targetX = -2; }
                    else if (offset > 0.60) { targetX = 0; }
                    group.current.position.x = THREE.MathUtils.lerp(group.current.position.x, targetX, delta * 4);
                    group.current.position.y = THREE.MathUtils.lerp(group.current.position.y, targetY, delta * 4);
                }
            });

            return (
                <group ref={group} {...props} dispose={null} position={[2, -0.5, 0]}>
                    <mesh rotation={[0,0,0]}>
                        <planeGeometry args={[1.5, 3.5]} /> 
                        <meshStandardMaterial map={texture} transparent={true} side={THREE.DoubleSide} alphaTest={0.5} />
                    </mesh>
                </group>
            );
        }

        function Experience() {
            return (
                <React.Fragment>
                    <ambientLight intensity={1.5} />
                    <directionalLight position={[5, 5, 5]} intensity={2} castShadow />
                    <Float speed={2} rotationIntensity={0.5} floatIntensity={0.5}>
                        <HumanModel scale={1} />
                    </Float>
                </React.Fragment>
            );
        }

        function App() {
            return (
                <Canvas camera={{ position: [0, 0, 5], fov: 40 }} className="canvas-container">
                    <ScrollControls pages={3} damping={0.25}>
                        <Experience />
                        <Scroll html style={{ width: '100%', height: '100%' }}>
                            <main className="container-fluid p-0">
                                <section className="section section-left row m-0">
                                    <div className="col-lg-6 offset-lg-1">
                                        <h1 className="display-3 fw-bold">Meet the Future</h1>
                                        <p className="lead">Interactive 3D experience.</p>
                                        <button className="btn btn-primary btn-lg mt-3">Get Started</button>
                                    </div>
                                </section>
                                <section className="section section-right row m-0">
                                    <div className="col-lg-6 offset-lg-5 text-end">
                                        <h1 className="display-3 fw-bold">360° Rotation</h1>
                                        <p className="lead">Procedural model adapts to scroll.</p>
                                        <button className="btn btn-outline-dark btn-lg mt-3">Learn More</button>
                                    </div>
                                </section>
                                <section className="section section-center row m-0">
                                    <div className="col-12 text-center">
                                        <h1 className="display-3 fw-bold">Seamless Integration</h1>
                                        <p className="lead mx-auto">WebGL + HTML + Bootstrap.</p>
                                        <div className="d-flex gap-3 justify-content-center mt-4">
                                             <button className="btn btn-dark btn-lg">Documentation</button>
                                             <button className="btn btn-outline-primary btn-lg">View Source</button>
                                        </div>
                                    </div>
                                </section>
                            </main>
                        </Scroll>
                    </ScrollControls>
                </Canvas>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
